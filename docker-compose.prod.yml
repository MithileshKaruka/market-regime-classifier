version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - backend-data:/app/data
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - ENVIRONMENT=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # No VITE_API_URL needed - defaults to empty for relative URLs
      # All API requests go through nginx proxy to backend:8000
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  # NOTE: live-ingestion is now integrated into the backend service
  # It runs as a background task within FastAPI when ENVIRONMENT=production
  # This ensures WebSocket updates are sent to actual connected clients
  # (separate process would have its own ConnectionManager with no connections)
  #
  # live-ingestion:
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile
  #   command: python -m app.streaming.live_ingestion
  #   volumes:
  #     - backend-data:/app/data
  #   env_file:
  #     - ./backend/.env
  #   environment:
  #     - PYTHONUNBUFFERED=1
  #     - LOG_LEVEL=INFO
  #     - ENVIRONMENT=production
  #   depends_on:
  #     - backend
  #   restart: unless-stopped

volumes:
  backend-data:
    driver: local
