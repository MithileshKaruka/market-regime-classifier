# Agent Configuration
# This file controls the trading agent's scoring weights, thresholds, and risk parameters

# =============================================================================
# BIAS SCORING WEIGHTS (must sum to 100)
# =============================================================================
scoring:
  # Trend & Structure: EMA crossovers, market structure (HH/HL vs LH/LL), S/R levels
  trend_structure_weight: 20

  # Market Intensity: RVOL (volume conviction) + VPIN (informed trading)
  market_intensity_weight: 30

  # Orderflow Alpha: OBI, LDR, Absorption, LSF signals
  orderflow_alpha_weight: 50

# =============================================================================
# SCORE THRESHOLDS (0-100 scale)
# =============================================================================
thresholds:
  # Mode boundaries
  high_bearish_max: 30      # 0-30 = HIGH_BEARISH (short only)
  weak_bearish_max: 45      # 30-45 = WEAK_BEARISH (exit longs)
  neutral_max: 55           # 45-55 = NEUTRAL (wait)
  weak_bullish_max: 70      # 55-70 = WEAK_BULLISH (cautious longs)
  # 70-100 = HIGH_BULLISH (aggressive longs)

# =============================================================================
# TREND & STRUCTURE PARAMETERS
# =============================================================================
trend_structure:
  # EMA periods for trend detection
  ema_fast: 12
  ema_slow: 25

  # Swing detection lookback
  swing_lookback: 5

  # Market structure analysis lookback
  structure_lookback: 20

  # S/R proximity threshold (percentage)
  sr_proximity_pct: 0.5

# =============================================================================
# TECHNICAL INDICATORS
# =============================================================================
indicators:
  # Rolling VWAP periods
  rvwap_periods: [7, 30, 90, 200]

  # EMA periods
  ema_periods: [20, 50, 100, 200]

  # Bollinger Bands
  bb_period: 20
  bb_std: 2.0

  # ATR (Average True Range)
  atr_period: 14

# =============================================================================
# INSTRUMENT CONFIGURATION
# =============================================================================
instrument:
  symbol: MNQ
  tick_size: 0.25
  min_price: 18000            # Price filter minimum
  max_price: 32000            # Price filter maximum

# =============================================================================
# LIVE STREAMING CONFIGURATION
# =============================================================================
streaming:
  dataset: GLBX.MDP3          # Databento dataset
  default_symbols:
    - MNQ
  default_timeframes:
    - 5M
    - 15M
    - 1H
    - 4H
    - 1D
  flush_interval_seconds: 1.0 # How often to flush to database
  dom_smoothing_factor: 0.9   # EMA factor for DOM updates (0.9 = slow, 0.5 = fast)

# =============================================================================
# MARKET INTENSITY PARAMETERS
# =============================================================================
market_intensity:
  # RVOL thresholds
  rvol_lookback: 20
  rvol_high: 1.5            # Above this = high volume conviction
  rvol_low: 0.5             # Below this = low volume (potential fakeout)

  # VPIN thresholds
  vpin_buckets: 50
  vpin_num_buckets: 50      # Number of buckets for rolling VPIN calculation
  vpin_elevated: 0.5        # Above this = elevated informed trading
  vpin_alert: 0.7           # Above this = high alert

  # POC (Point of Control)
  poc_lookback: 100         # Bars to look back for POC calculation

# =============================================================================
# ORDERFLOW ALPHA PARAMETERS
# =============================================================================
orderflow_alpha:
  # OBI (Order Book Imbalance) thresholds
  # Backtested: 15M shows edge (55.7% hit rate, 1.57 PF at threshold 2.2)
  # 5M and 1M show no significant edge with current detection logic
  obi_strong_imbalance: 2.5   # Bid/Ask ratio for strong signal
  obi_moderate_imbalance: 2.0 # Moderate imbalance threshold
  obi_threshold: 2.2          # Signal detection threshold (backtested optimal)

  # LDR (Liquidity Depth Ratio) thresholds
  ldr_wall_threshold: 2.5     # Ratio for support/resistance wall detection

  # CVD (Cumulative Volume Delta) thresholds
  # CVD from trades shows true buying/selling pressure
  # Positive CVD = net buying (bullish), Negative CVD = net selling (bearish)
  cvd_threshold: 5000         # Significant CVD threshold for scoring (contracts)
  # Scoring ranges:
  # - Strong: |CVD| > 2x threshold = 90-100 score contribution
  # - Moderate: |CVD| > threshold = 60-90 score contribution
  # - Weak: |CVD| < threshold = 40-60 score contribution

  # Absorption detection
  # Default values (conservative middle-ground for untested timeframes)
  absorption_volume_mult: 1.5  # Volume multiplier vs average
  absorption_price_tol: 0.0015  # 0.15% price tolerance for stable price
  absorption_dom_threshold: 0.52  # DOM > 0.52 bullish, < 0.48 bearish
  absorption_lookback: 15

  # Timeframe-specific absorption parameters
  # 1M, 5M, 15M: from backtesting | 1H+: projected (needs more data)
  absorption_by_tf:
    1M:
      volume_mult: 1.8
      price_tol: 0.002
      dom_threshold: 0.51
      lookback: 10
    5M:
      volume_mult: 1.8
      price_tol: 0.0005
      dom_threshold: 0.51
      lookback: 50
    15M:  # Backtested: 66.7% hit rate, 3.56 PF
      volume_mult: 1.3
      price_tol: 0.002
      dom_threshold: 0.51
      lookback: 10
    1H:  # Projected - DOM averages to 0.5 at this TF, needs different approach
      volume_mult: 1.8
      price_tol: 0.005
      dom_threshold: 0.51
      lookback: 24
    4H:  # Projected
      volume_mult: 1.8
      price_tol: 0.005
      dom_threshold: 0.51
      lookback: 30
    1D:  # Projected
      volume_mult: 1.8
      price_tol: 0.005
      dom_threshold: 0.51
      lookback: 20

  # Timeframe-specific OBI thresholds
  # Only 15M currently shows predictive value; others use higher thresholds
  obi_by_tf:
    1M:
      threshold: 2.5          # Higher threshold, marginal edge
    5M:
      threshold: 2.2          # Marginal edge at best
    15M:                      # Backtested: 55.7% hit rate, 1.57 PF
      threshold: 2.2
    1H:
      threshold: 2.0          # Projected (untested)
    4H:
      threshold: 2.0          # Projected (untested)
    1D:
      threshold: 2.0          # Projected (untested)

  # LSF (Liquidity Sweep Fade) detection - PURE PRICE BASED
  # No delta requirement - focuses on price sweeps and snapbacks
  lsf_sweep_threshold_pct: 0.001  # Min % price must exceed prior high/low (0.1%)
  lsf_snapback_pct: 0.002         # Min % snapback into range (0.2%)
  lsf_snapback_bars: 3            # Max bars to wait for snapback

  # Delta Unwind detection
  # Detects when cumulative delta reaches extreme and starts reversing
  delta_zscore_threshold: 2.0     # Z-score threshold for "extreme" delta
  delta_unwind_pct: 0.1           # Min % of delta that must unwind (10%)
  delta_unwind_bars: 3            # Bars to confirm unwind

  # Exhaustion detection
  # High volume with minimal price movement indicates exhaustion
  exhaustion_volume_mult: 1.5     # Volume must exceed avg by this mult
  exhaustion_range_ratio_max: 0.5 # Price range must be < expected * this ratio

# =============================================================================
# RISK MANAGEMENT
# =============================================================================
risk:
  # Default stop loss (percentage from entry)
  stop_loss_pct: 0.5

  # Take profit targets by mode
  take_profit:
    weak_bullish: 1.0         # Conservative target
    high_bullish: 1.5         # Aggressive target
    weak_bearish: 1.0
    high_bearish: 1.5

  # Position sizing (future use)
  max_position_size: 1.0
  scale_in_size: 0.5

# =============================================================================
# AGENT BEHAVIOR
# =============================================================================
agent:
  # Maximum observation iterations before forcing decision
  max_iterations: 3

  # Confidence levels
  confidence:
    high_threshold: 70        # Score > 70 or < 30 = HIGH confidence
    medium_threshold: 55      # Score 55-70 or 30-45 = MEDIUM confidence
    # Otherwise = LOW confidence

  # Require high confidence for these actions
  require_high_confidence:
    - ADD_TO_LONG
    - ADD_TO_SHORT
    - ENTER_SHORT   # Shorts are riskier, require more conviction

# =============================================================================
# SIGNAL DETECTION
# =============================================================================
signals:
  # Lookback period for recent signals
  recent_signal_bars: 20

  # Signal strength multipliers (how much each signal type contributes)
  strength_multipliers:
    absorption: 1.0
    lsf: 1.0                  # Pure price LSF
    obi: 0.8
    delta_unwind: 1.2         # Delta unwind (reversal signal)
    exhaustion: 1.0           # Exhaustion (reversal signal)

# =============================================================================
# REGIME CLASSIFICATION
# =============================================================================
regime:
  # CVD Rolling Window Sizes (number of bars to look back)
  cvd_windows:
    5M: 288    # 24 hours (288 * 5min = 1440min = 24h)
    15M: 96    # 24 hours (96 * 15min = 1440min = 24h)
    1H: 24     # 24 hours (24 * 1h = 24h)
    4H: 30     # 5 days (30 * 4h = 120h = 5 days)
    1D: 5      # 5 days

  # Regime Classification Thresholds
  thresholds:
    dom_threshold: 0.55       # DOM imbalance threshold for bullish/bearish
    cvd_threshold: 5000       # CVD threshold (will need adjustment after rolling window)
    vwap_threshold: 0.001     # VWAP distance threshold (0.1%)

  # Signal Weights (must sum to 1.0) - Order: [DOM, CVD, VWAP]
  signal_weights:
    dom: 0.6                  # DOM 60%
    cvd: 0.2                  # CVD 20%
    vwap: 0.2                 # VWAP 20%

# =============================================================================
# SUPPORT/RESISTANCE CONFIGURATION
# =============================================================================
support_resistance:
  # S/R Level Detection
  min_touches: 3              # Minimum touches to consider a level significant (default)
  proximity_pct: 0.002        # Price proximity to level (0.2%)
  swing_window: 5             # Window for swing point detection (default)

  # Timeframe-specific swing windows (smaller = more sensitive)
  swing_window_by_tf:
    5M: 3                     # Very sensitive for intraday
    15M: 3                    # Sensitive for intraday
    1H: 3                     # More sensitive to catch more levels
    4H: 3                     # More sensitive to catch more levels
    1D: 5                     # Standard for daily

  # Timeframe-specific min touches
  min_touches_by_tf:
    5M: 2                     # Lower for intraday
    15M: 2
    1H: 2
    4H: 2
    1D: 2

  # Volume Profile
  volume_profile_bins: 50     # Number of price bins for volume profile
  volume_profile_top_n: 3     # Top N volume nodes to include

  # S/R Signal Weights (for buy/sell signals at S/R levels)
  # Order: [DOM, CVD] - VWAP ignored for S/R signals
  signal_weights:
    dom: 0.5                  # DOM 50%
    cvd: 0.5                  # CVD 50%

  # S/R Signal Thresholds
  signal_thresholds:
    dom_threshold: 0.55       # DOM imbalance threshold
    cvd_threshold: 500        # CVD threshold for S/R signals (lower than regime CVD)

  # S/R Price Range Configuration (percentage from current price)
  # Controls how much historical data to analyze for S/R detection
  price_range_pct:
    5M: 10.0                  # Moderate - recent intraday swings
    15M: 10.0                 # Moderate - recent intraday swings
    1H: 15.0                  # Wide - includes swing levels
    4H: 15.0                  # Wide - includes recent swings
    1D: 20.0                  # Wider for daily - full context

  # S/R Recency Threshold (percentage) - for filtering nearby levels
  recency_threshold_pct:
    5M: 0.5                   # Very tight for intraday
    15M: 0.8                  # Tight for intraday
    1H: 1.0                   # Moderate
    4H: 1.5                   # Wider for swing
    1D: 2.5                   # Widest for daily levels
