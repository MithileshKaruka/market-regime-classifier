# Agent Configuration
# This file controls the trading agent's scoring weights, thresholds, and risk parameters

# =============================================================================
# BIAS SCORING WEIGHTS (must sum to 100)
# =============================================================================
# Backtested 2025-02 with explore_edge_improvements.py on 160 days of data:
#   5M:  T20/I20/O60 = 52.5% hit, 1.17 PF (current default optimal)
#   15M: T10/I30/O60 = 50.6% hit, 0.89 PF (best) vs T20/I20/O60 = 48.6%, 0.85 PF
#   1H:  T10/I30/O60 = 51.6% hit, 1.08 PF (best) vs T20/I20/O60 = 49.0%, 0.87 PF
#   4H:  T10/I30/O60 = 52.8% hit, 1.13 PF (best) vs T20/I20/O60 = 52.6%, 1.04 PF
scoring:
  # Default weights (optimal for 5M)
  trend_structure_weight: 20
  market_intensity_weight: 20
  orderflow_alpha_weight: 60

  # Timeframe-specific weights (from explore_edge_improvements.py backtest)
  by_timeframe:
    5M:   # Current default is optimal
      trend: 20
      intensity: 20
      orderflow: 60
    15M:  # Lower trend, boost intensity
      trend: 10
      intensity: 30
      orderflow: 60
    1H:   # Lower trend, boost intensity
      trend: 10
      intensity: 30
      orderflow: 60
    4H:   # Lower trend, boost intensity
      trend: 10
      intensity: 30
      orderflow: 60
    1D:   # Use default
      trend: 20
      intensity: 20
      orderflow: 60

# =============================================================================
# SCORE THRESHOLDS (0-100 scale)
# =============================================================================
thresholds:
  # Mode boundaries - optimized from backtesting
  # 15M sweep found 52/48 optimal, but keeping slightly wider for robustness
  high_bearish_max: 30      # 0-30 = HIGH_BEARISH (short only)
  weak_bearish_max: 45      # 30-45 = WEAK_BEARISH (exit longs)
  neutral_max: 55           # 45-55 = NEUTRAL (wait)
  weak_bullish_max: 70      # 55-70 = WEAK_BULLISH (cautious longs)
  # 70-100 = HIGH_BULLISH (aggressive longs)

  # Timeframe-specific optimal thresholds (from backtest_indicator_combinations_fast.py)
  # Note: Bearish signals significantly outperform bullish on 5M (64.7% vs 48.5%)
  by_timeframe:
    5M:
      # Wider thresholds work best: 60/40 = 58.3% hit rate, 1.70 PF
      bullish: 60
      bearish: 40
      high_conviction: 70
      min_mode_duration: 2
      prefer_bearish: true  # Bearish signals 64.7% vs bullish 48.5%
    15M:
      # Tighter thresholds: 58/42 optimal (1.02 PF)
      bullish: 58
      bearish: 42
      high_conviction: 65
      min_mode_duration: 2
    1H:
      # Trend+Intensity performs best, use standard thresholds
      bullish: 55
      bearish: 45
      high_conviction: 70
      min_mode_duration: 3
    4H:
      # int_zone approach works best at zones
      bullish: 55
      bearish: 45
      high_conviction: 70
      min_mode_duration: 3

# =============================================================================
# TREND & STRUCTURE PARAMETERS
# =============================================================================
trend_structure:
  # EMA periods for trend detection
  ema_fast: 12
  ema_slow: 25

  # Swing detection lookback
  swing_lookback: 5

  # Market structure analysis lookback
  structure_lookback: 20

  # S/R proximity threshold (percentage)
  sr_proximity_pct: 0.5

# =============================================================================
# TECHNICAL INDICATORS
# =============================================================================
indicators:
  # Rolling VWAP periods
  rvwap_periods: [7, 30, 90, 200]

  # EMA periods
  ema_periods: [20, 50, 100, 200]

  # Bollinger Bands
  bb_period: 20
  bb_std: 2.0

  # ATR (Average True Range)
  atr_period: 14

# =============================================================================
# INSTRUMENT CONFIGURATION
# =============================================================================
instrument:
  symbol: MNQ
  tick_size: 0.25
  min_price: 18000            # Price filter minimum
  max_price: 32000            # Price filter maximum

# =============================================================================
# LIVE STREAMING CONFIGURATION
# =============================================================================
streaming:
  dataset: GLBX.MDP3          # Databento dataset
  default_symbols:
    - MNQ.FUT  # Parent symbol format for continuous contracts
  default_timeframes:
    - 5M
    - 15M
    - 1H
    - 4H
    - 1D
  flush_interval_seconds: 1.0 # How often to flush to database
  dom_smoothing_factor: 0.9   # EMA factor for DOM updates (0.9 = slow, 0.5 = fast)

# =============================================================================
# MARKET INTENSITY PARAMETERS
# =============================================================================
market_intensity:
  # RVOL thresholds
  rvol_lookback: 20
  rvol_high: 1.5            # Above this = high volume conviction
  rvol_low: 0.5             # Below this = low volume (potential fakeout)

  # VPIN thresholds
  vpin_buckets: 50
  vpin_num_buckets: 50      # Number of buckets for rolling VPIN calculation
  vpin_elevated: 0.5        # Above this = elevated informed trading
  vpin_alert: 0.7           # Above this = high alert

  # POC (Point of Control)
  poc_lookback: 100         # Bars to look back for POC calculation

# =============================================================================
# ORDERFLOW SCORING APPROACH (Backtested 2025-02)
# =============================================================================
# Available approaches:
#   original    - CVD magnitude in BASE mode (best zone accuracy 31-67%)
#   signal_req  - Neutral unless primary signal fires (best 5M: 70.6% hit, 4.01 PF)
#   cvd_dir     - CVD direction only, not magnitude (best 15M hit: 55%)
#   int_zone    - Boost Intensity weight at zones (best 4H: 56% hit, 47.6% zone acc)
#   comp_agree  - Require 2+ components to agree
#   trend_int   - Trend+Intensity only, orderflow neutral in BASE (best 1H: 1.12 PF)
#
# Best performing by timeframe (from backtest_agent_bias.py --compare-approaches):
#   5M:  signal_req (70.6% hit, 4.01 PF) - but requires primary signal to fire
#   15M: cvd_dir (55.0% hit) or original (best zone accuracy)
#   1H:  trend_int (49.4% hit, 1.12 PF)
#   4H:  int_zone (56.0% hit, 47.6% zone accuracy)
orderflow_approach:
  default: original
  by_timeframe:
    5M: signal_req     # Best hit rate and PF when signals fire
    15M: original      # Best zone accuracy
    1H: trend_int      # Orderflow too noisy, let trend/intensity decide
    4H: int_zone       # Boost intensity at zones
    1D: original       # Zone accuracy matters most

# =============================================================================
# ORDERFLOW ALPHA PARAMETERS
# =============================================================================
orderflow_alpha:
  # OBI (Order Book Imbalance) thresholds
  # NOTE: When using DOM-derived imbalance (dom / (1-dom)), thresholds must be lower
  # DOM 0.56 -> imbalance 1.27, DOM 0.60 -> imbalance 1.5, DOM 0.65 -> imbalance 1.86
  obi_strong_imbalance: 1.5   # Bid/Ask ratio for strong signal (DOM ~0.60)
  obi_moderate_imbalance: 1.3 # Moderate imbalance threshold (DOM ~0.56)
  obi_threshold: 1.3          # Signal detection threshold for DOM-derived data

  # LDR (Liquidity Depth Ratio) thresholds
  ldr_wall_threshold: 2.5     # Ratio for support/resistance wall detection

  # CVD (Cumulative Volume Delta) thresholds
  # CVD from trades shows true buying/selling pressure
  # Positive CVD = net buying (bullish), Negative CVD = net selling (bearish)
  cvd_threshold: 5000         # Significant CVD threshold for scoring (contracts)
  # Scoring ranges:
  # - Strong: |CVD| > 2x threshold = 90-100 score contribution
  # - Moderate: |CVD| > threshold = 60-90 score contribution
  # - Weak: |CVD| < threshold = 40-60 score contribution

  # Absorption detection (trade flow based)
  # Direction = OPPOSITE of aggressive flow (absorber wins)
  # Note: Only works on 5M/15M - trade_flow_ratio smooths to ~0.50 on higher TFs
  absorption_volume_mult: 1.5  # Volume multiplier vs average (default)
  absorption_price_tol: 0.002  # 0.2% price tolerance for stable price
  absorption_dom_threshold: 0.52  # DOM threshold (legacy fallback)
  absorption_lookback: 20

  # Timeframe-specific absorption parameters (backtested with trade flow)
  # delta_z = z-score of instant_delta
  # tf_threshold = trade_flow_ratio confirmation threshold
  absorption_by_tf:
    5M:  # Backtested: 71% hit rate, PF 3.54
      volume_mult: 2.0
      price_tol: 0.001
      delta_z: 2.0
      tf_threshold: 0.55
      lookback: 10
    15M:  # Backtested: 83% hit rate, PF 11.0
      volume_mult: 1.2
      price_tol: 0.002
      delta_z: 1.5
      tf_threshold: 0.60
      lookback: 20
    # 1H+ disabled - trade_flow_ratio smooths to ~0.50, no edge
      price_tol: 0.005
      dom_threshold: 0.51
      lookback: 20

  # Timeframe-specific OBI thresholds
  # Adjusted for DOM-derived imbalance (dom / (1-dom))
  obi_by_tf:
    1M:
      threshold: 1.4          # Slightly higher for noise filtering
    5M:
      threshold: 1.3          # DOM ~0.56+ triggers signal
    15M:
      threshold: 1.3          # DOM ~0.56+ triggers signal
    1H:
      threshold: 1.25         # Slightly lower for aggregated data
    4H:
      threshold: 1.25
    1D:
      threshold: 1.2

  # LSF (Liquidity Sweep Fade) detection - PURE PRICE BASED
  # No delta requirement - focuses on price sweeps and snapbacks
  lsf_sweep_threshold_pct: 0.001  # Min % price must exceed prior high/low (0.1%)
  lsf_snapback_pct: 0.002         # Min % snapback into range (0.2%)
  lsf_snapback_bars: 3            # Max bars to wait for snapback

  # Delta Unwind detection
  # Detects when cumulative delta reaches extreme and starts reversing
  # Backtested: 91.7% hit rate, 33.75 PF at z=1.5, unwind=15%, bars=8
  delta_zscore_threshold: 1.5     # Z-score threshold for "extreme" delta
  delta_unwind_pct: 0.15          # Min % of delta that must unwind (15%)
  delta_unwind_bars: 8            # Bars to confirm unwind
  delta_lookback_bars: 100        # Lookback for z-score calculation

  # Exhaustion detection (AND logic: delta + trend must agree)
  # High volume with minimal price movement indicates exhaustion
  # Backtested by TF: 5M 70.6%/PF6.42, 15M 58.8%/PF2.72, 1H 60.4%/PF2.31
  # Code has timeframe-specific defaults; these are fallback values
  exhaustion_volume_mult: 1.8     # Volume must exceed avg by this mult
  exhaustion_range_ratio_max: 0.60 # Price range must be < expected * this ratio
  exhaustion_trend_lookback: 5    # Bars to determine trend direction
  exhaustion_lookback_bars: 20    # Lookback for rolling averages

  # Institutional Activity detection (from trades data)
  # Detects large trades (>=50 contracts) with directional flow
  # Indicates institutional accumulation/distribution
  # Backtested 15M: 80% hit rate, 8.99 PF with volume confirmation
  inst_large_trade_min: 2         # Min large trades per bar to trigger signal
  inst_flow_threshold: 0.55       # Trade flow ratio threshold (>0.55 bullish, <0.45 bearish)
  inst_volume_mult: 1.2           # Volume spike confirmation (volume > avg * 1.2)

  # Trade Flow Divergence detection (from trades data)
  # Detects when trade flow diverges from price direction (contrarian signal)
  # Example: price falling but >58% buys = bullish divergence (hidden accumulation)
  # Backtested 15M: 100% hit rate with persistence + volume + flow smoothing
  tfd_flow_threshold: 0.58        # Trade flow ratio threshold for divergence
  tfd_price_change_pct: 0.001     # Min price change (0.10%) to consider directional
  tfd_lookback_bars: 5            # Bars to measure price change over
  tfd_persistence_bars: 2         # Require 2 consecutive bars with divergence
  tfd_volume_mult: 1.3            # Volume spike confirmation (volume > avg * 1.3)
  tfd_flow_avg_bars: 2            # Rolling average bars for flow smoothing
  volume_lookback: 20             # Lookback bars for volume average calculation

# =============================================================================
# RISK MANAGEMENT
# =============================================================================
risk:
  # Default stop loss (percentage from entry)
  stop_loss_pct: 0.5

  # Take profit targets by mode
  take_profit:
    weak_bullish: 1.0         # Conservative target
    high_bullish: 1.5         # Aggressive target
    weak_bearish: 1.0
    high_bearish: 1.5

  # Position sizing (future use)
  max_position_size: 1.0
  scale_in_size: 0.5

# =============================================================================
# AGENT BEHAVIOR
# =============================================================================
agent:
  # Maximum observation iterations before forcing decision
  max_iterations: 3

  # Confidence levels
  confidence:
    high_threshold: 70        # Score > 70 or < 30 = HIGH confidence
    medium_threshold: 55      # Score 55-70 or 30-45 = MEDIUM confidence
    # Otherwise = LOW confidence

  # Require high confidence for these actions
  require_high_confidence:
    - ADD_TO_LONG
    - ADD_TO_SHORT
    - ENTER_SHORT   # Shorts are riskier, require more conviction

# =============================================================================
# SIGNAL DETECTION
# =============================================================================
signals:
  # Lookback period for recent signals
  recent_signal_bars: 20

  # Signal strength multipliers (how much each signal type contributes)
  strength_multipliers:
    absorption: 1.0
    lsf: 1.0                  # Pure price LSF
    obi: 0.8
    delta_unwind: 1.2         # Delta unwind (reversal signal)
    exhaustion: 1.0           # Exhaustion (reversal signal)
    institutional: 1.5        # Institutional activity (from trades - high conviction)
    trade_flow_div: 1.2       # Trade flow divergence (contrarian signal)

# =============================================================================
# REGIME CLASSIFICATION
# =============================================================================
regime:
  # CVD Rolling Window Sizes (number of bars to look back)
  cvd_windows:
    5M: 288    # 24 hours (288 * 5min = 1440min = 24h)
    15M: 96    # 24 hours (96 * 15min = 1440min = 24h)
    1H: 24     # 24 hours (24 * 1h = 24h)
    4H: 30     # 5 days (30 * 4h = 120h = 5 days)
    1D: 5      # 5 days

  # Regime Classification Thresholds
  thresholds:
    dom_threshold: 0.55       # DOM imbalance threshold for bullish/bearish
    cvd_threshold: 5000       # CVD threshold (will need adjustment after rolling window)
    vwap_threshold: 0.001     # VWAP distance threshold (0.1%)

  # Signal Weights (must sum to 1.0) - Order: [DOM, CVD, VWAP]
  signal_weights:
    dom: 0.6                  # DOM 60%
    cvd: 0.2                  # CVD 20%
    vwap: 0.2                 # VWAP 20%

# =============================================================================
# ZONE-BASED TRADING CONFIGURATION (Backtested 2025-02)
# =============================================================================
# Zone detection parameters moved to zone_bias.py ZONE_PARAMS
#
# Key findings from explore_edge_improvements.py (160 days, all TFs):
#   Zone trading WITHOUT signals outperforms requiring signals!
#   5M:  52.7% hit, 1.12 PF (8,523 trades)
#   15M: 52.6% hit, 1.11 PF (6,187 trades)
#   1H:  56.2% hit, 1.46 PF (4,058 trades) - BEST
#   4H:  58.6% hit, 1.44 PF (1,149 trades) - EXCELLENT
#
# Higher timeframes show better zone prediction accuracy
zone_trading:
  # When at a zone, boost Market Intensity weight
  at_zone_intensity_boost: 1.5   # Multiply intensity contribution by 1.5x at zones

  # Require primary signal for orderflow contribution at zones
  # DISABLED: Backtesting shows zones work BETTER without requiring signals
  require_signal_at_zone: false  # Zone direction alone has edge (52-58% hit rate)

  # Zone proximity threshold (% from zone boundary to consider "at zone")
  zone_proximity_pct: 0.003      # 0.3% from zone edge

  # Zone quality minimum (0-100) - zones below this are ignored
  min_zone_quality: 40

# =============================================================================
# SUPPORT/RESISTANCE CONFIGURATION
# =============================================================================
support_resistance:
  # S/R Level Detection
  min_touches: 3              # Minimum touches to consider a level significant (default)
  proximity_pct: 0.002        # Price proximity to level (0.2%)
  swing_window: 5             # Window for swing point detection (default)

  # Timeframe-specific swing windows (smaller = more sensitive)
  swing_window_by_tf:
    5M: 3                     # Very sensitive for intraday
    15M: 3                    # Sensitive for intraday
    1H: 3                     # More sensitive to catch more levels
    4H: 3                     # More sensitive to catch more levels
    1D: 5                     # Standard for daily

  # Timeframe-specific min touches
  min_touches_by_tf:
    5M: 2                     # Lower for intraday
    15M: 2
    1H: 2
    4H: 2
    1D: 2

  # Volume Profile
  volume_profile_bins: 50     # Number of price bins for volume profile
  volume_profile_top_n: 3     # Top N volume nodes to include

  # S/R Signal Weights (for buy/sell signals at S/R levels)
  # Weights are normalized to sum to 1.0
  signal_weights:
    dom: 0.4                  # DOM 40% - order book pressure
    cvd: 0.3                  # CVD 30% - cumulative delta
    trade_flow: 0.3           # Trade Flow 30% - actual trade direction (from trades data)

  # S/R Signal Thresholds
  signal_thresholds:
    dom_threshold: 0.55       # DOM imbalance threshold
    cvd_threshold: 500        # CVD threshold for S/R signals (lower than regime CVD)

  # S/R Price Range Configuration (percentage from current price)
  # Controls how much historical data to analyze for S/R detection
  price_range_pct:
    5M: 10.0                  # Moderate - recent intraday swings
    15M: 10.0                 # Moderate - recent intraday swings
    1H: 15.0                  # Wide - includes swing levels
    4H: 15.0                  # Wide - includes recent swings
    1D: 20.0                  # Wider for daily - full context

  # S/R Recency Threshold (percentage) - for filtering nearby levels
  recency_threshold_pct:
    5M: 0.5                   # Very tight for intraday
    15M: 0.8                  # Tight for intraday
    1H: 1.0                   # Moderate
    4H: 1.5                   # Wider for swing
    1D: 2.5                   # Widest for daily levels
